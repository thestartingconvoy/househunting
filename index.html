<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The room with the sunsets · 3BHK, Sector 47, Gurgaon</title>
<meta name="description" content="Flatmate wanted. West-facing room, 14th floor, Sector 47 Gurgaon. ₹22k a month, fully furnished, no brokerage.">
<meta name="theme-color" content="#241A14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FFF4E6;
  --sand:#E8D5BC;
  --ember:#FF8A4C;
  --gold:#FFC66B;
  --wall-1:#433226; --wall-2:#241A14; --floor:#181110;
  --ease:cubic-bezier(.22,1,.36,1);
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--wall-2);color:var(--cream);
  font-family:var(--sans);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
svg{display:block}
::selection{background:var(--ember);color:#231A14}

/* ── the room ─────────────────────────────────────── */
.room{
  position:relative;width:100%;height:100vh;height:100svh;
  overflow:hidden;isolation:isolate;
  background:
    radial-gradient(120% 90% at 78% 32%, rgba(255,150,80,.28), transparent 62%),
    linear-gradient(170deg, var(--wall-1) 0%, var(--wall-2) 58%, #1B1310 100%);
}

/* floor + the pool of light the window throws */
.floor{
  position:absolute;left:0;right:0;bottom:0;height:27%;
  background:linear-gradient(to bottom,#2A1E18,var(--floor) 70%);
  border-top:1px solid rgba(255,190,130,.14);
}
.floor::after{
  content:'';position:absolute;left:50%;top:-6%;width:130%;height:96%;
  transform:translateX(-50%);
  background:radial-gradient(ellipse at 62% 40%, rgba(255,166,86,.30), rgba(255,140,70,.10) 45%, transparent 72%);
  animation:glowpulse 9s ease-in-out infinite;
}
@keyframes glowpulse{0%,100%{opacity:.85}50%{opacity:1}}

/* dust in the light */
.motes{position:absolute;inset:0;pointer-events:none;z-index:2}
.mote{
  position:absolute;width:3px;height:3px;border-radius:50%;
  background:rgba(255,214,160,.9);opacity:0;
  animation:float 16s linear infinite;
}
@keyframes float{
  0%{opacity:0;transform:translate(0,0)}
  12%{opacity:.75}
  80%{opacity:.45}
  100%{opacity:0;transform:translate(26px,-160px)}
}

/* ── window ───────────────────────────────────────── */
.window{
  position:absolute;z-index:1;
  left:50%;transform:translateX(-50%);
  top:42%;width:76%;height:27%;
  border-radius:14px;
  box-shadow:0 0 0 9px #EFE0CC, 0 0 0 11px rgba(0,0,0,.25),
             0 0 70px 18px rgba(255,150,70,.30), 0 30px 70px -20px rgba(0,0,0,.6);
  overflow:hidden;
}
.window svg{width:100%;height:100%}
.mullion{position:absolute;inset:0;pointer-events:none}
.mullion::before,.mullion::after{content:'';position:absolute;background:#EFE0CC}
.mullion::before{left:50%;top:0;bottom:0;width:7px;margin-left:-3.5px}
.mullion::after{left:0;right:0;top:50%;height:7px;margin-top:-3.5px}
.win{fill:#FFD98A;opacity:0;transition:opacity 1s ease}
.win.on{opacity:.9}

/* ── furniture placement ──────────────────────────── */
.couch{position:absolute;z-index:3;left:50%;transform:translateX(-50%);bottom:14%;width:88%}
.tv   {position:absolute;z-index:3;left:0;bottom:23%;width:21%}
.plant{position:absolute;z-index:3;right:1%;bottom:15%;width:18%;display:none}
.tv svg{overflow:visible}

@media(min-width:700px){.plant{display:block}}
@media(min-width:900px){
  .window{left:auto;right:8%;transform:none;top:14%;width:44%;height:48%}
  .couch {left:auto;transform:none;right:15%;bottom:12%;width:42%}
  .tv    {left:4%;bottom:15%;width:15%}
  .plant {right:1%;bottom:14%;width:8%}
}

/* ── the cats ─────────────────────────────────────── */
.tail{animation:tail 3.6s ease-in-out infinite}
.tail-a{transform-origin:118px 122px}
.tail-b{transform-origin:118px 122px;animation-duration:4.4s;animation-delay:-1.2s}
@keyframes tail{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(12deg)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 6s infinite}
.eye-b{animation-duration:7.4s;animation-delay:-2s}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.06)}}
.ear{transform-box:fill-box;transform-origin:bottom center;animation:ear 9s ease-in-out infinite}
.ear-b{animation-duration:11s;animation-delay:-4s}
@keyframes ear{0%,90%,100%{transform:rotate(0)}94%{transform:rotate(-10deg)}97%{transform:rotate(5deg)}}
.cat-wrap{cursor:pointer;transform-box:fill-box;transform-origin:bottom center;transition:transform .5s var(--ease)}

/* tv glow washing over the room */
.screen{animation:tvflicker 2.8s steps(1) infinite}
@keyframes tvflicker{
  0%{fill:#9FC9F5}18%{fill:#C3AEF7}36%{fill:#8FD9E8}52%{fill:#F5C6A8}70%{fill:#A9BFF2}86%{fill:#D9C4F7}
}
.tv-cone{animation:cone 2.8s steps(1) infinite;transform-origin:left center}
@keyframes cone{0%{opacity:.30}18%{opacity:.46}36%{opacity:.26}52%{opacity:.42}70%{opacity:.32}86%{opacity:.48}}

.leaf{transform-box:fill-box;transform-origin:bottom center;animation:sway 7s ease-in-out infinite}
.leaf-2{animation-duration:9s;animation-delay:-3s}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}

/* ── copy ─────────────────────────────────────────── */
.scrim{
  position:absolute;inset:0;z-index:4;pointer-events:none;
  background:linear-gradient(to bottom,rgba(20,13,10,.62) 0%,rgba(20,13,10,.18) 34%,transparent 52%);
}
@media(min-width:900px){
  .scrim{background:linear-gradient(105deg,rgba(20,13,10,.78) 0%,rgba(20,13,10,.42) 38%,transparent 62%)}
}
.copy{
  position:absolute;z-index:5;
  top:max(6vh,env(safe-area-inset-top));left:22px;right:22px;
}
@media(min-width:900px){
  .copy{top:clamp(64px,11vh,130px);left:clamp(40px,7vw,110px);right:auto;max-width:min(560px,44vw)}
}
h1{
  margin:0;font-family:var(--serif);font-weight:400;
  font-size:clamp(42px,11.5vw,92px);line-height:.94;letter-spacing:-.02em;
  text-shadow:0 2px 40px rgba(20,10,5,.55),0 1px 3px rgba(20,10,5,.4);
}
h1 em{font-style:italic;color:var(--gold);display:block}
.sub{
  margin:18px 0 0;max-width:34ch;
  font-size:clamp(15px,4.1vw,18px);line-height:1.55;color:rgba(255,244,230,.88);
  text-shadow:0 1px 22px rgba(20,10,5,.7);
}
.cta{
  display:inline-flex;align-items:center;gap:10px;
  margin-top:28px;padding:17px 28px;border-radius:999px;
  background:var(--cream);color:#231A14;text-decoration:none;
  font-weight:600;font-size:16px;letter-spacing:-.01em;
  box-shadow:0 14px 40px -12px rgba(255,170,90,.75),0 2px 6px rgba(0,0,0,.3);
  transition:transform .4s var(--ease),box-shadow .4s var(--ease);
  position:relative;overflow:hidden;
}
.cta::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,.65) 45%,transparent 70%);
  transform:translateX(-120%);animation:sheen 5s var(--ease) infinite 2s;
}
@keyframes sheen{0%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}
.cta:hover,.cta:focus-visible{transform:translateY(-3px);box-shadow:0 22px 54px -14px rgba(255,170,90,.9),0 2px 6px rgba(0,0,0,.3)}
.cta:active{transform:translateY(-1px) scale(.985)}
.cta .arrow{transition:transform .4s var(--ease)}
.cta:hover .arrow{transform:translateX(4px)}

.heart{position:fixed;z-index:20;pointer-events:none;font-size:20px;animation:pop 1.1s var(--ease) forwards}
@keyframes pop{
  0%{opacity:0;transform:translate(0,0) scale(.4)}
  20%{opacity:1}
  100%{opacity:0;transform:translate(var(--dx),-70px) scale(1.2) rotate(var(--rot))}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<main class="room">

  <div class="couch">

      </g></g>
      <g transform="translate(330 108) scale(.84)"><g class="cat-wrap" id="catB">
        <path class="tail tail-b" d="M118 122c40 2 46-28 30-42" stroke="#AEB2BE" stroke-width="15" stroke-linecap="round" fill="none"/>

        <path d="M60 96c10-4 20-2 26 6-8 26-10 40-8 48h-22c-4-20-2-38 4-54z" fill="#EFF1F5"/>

</main>

<script>
(function(){
  'use strict';
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var NS = 'http://www.w3.org/2000/svg';

  /* seeded random so the skyline looks composed, not noisy */
  function rng(seed){ return function(){ seed = (seed*16807) % 2147483647; return seed/2147483647; }; }

  /* ── city outside the window ───────────────────────── */
  var sky = document.getElementById('skyline'), lights = [];
  function towers(seed, fill, minH, maxH, baseW, yBase){
    var rand = rng(seed), x = -14;
    while(x < 614){
      var w = baseW + Math.round(rand()*22);
      var h = minH + Math.round(rand()*(maxH-minH));
      var b = document.createElementNS(NS,'rect');
      b.setAttribute('x',x); b.setAttribute('y',yBase-h);
      b.setAttribute('width',w); b.setAttribute('height',h); b.setAttribute('fill',fill);
      sky.appendChild(b);
      if(rand() > .74){
        var t = document.createElementNS(NS,'rect');
        t.setAttribute('x',x+w/2-2); t.setAttribute('y',yBase-h-11);
        t.setAttribute('width',4); t.setAttribute('height',11); t.setAttribute('fill',fill);
        sky.appendChild(t);
      }
      for(var wy = yBase-h+9; wy < yBase-9; wy += 13){
        for(var wx = x+5; wx < x+w-7; wx += 11){
          var win = document.createElementNS(NS,'rect');
          win.setAttribute('x',wx); win.setAttribute('y',wy);
          win.setAttribute('width',5); win.setAttribute('height',7);
          win.setAttribute('class','win');
          sky.appendChild(win); lights.push(win);
        }
      }
      x += w + 4 + Math.round(rand()*11);
    }
  }
  towers(11, '#4B3560', 60, 128, 26, 300);   /* far, hazier */
  towers(29, '#2A1B35', 80, 176, 34, 300);   /* near */

  /* half the city is home for the evening */
  lights.forEach(function(w){ if(Math.random() > .52) w.classList.add('on'); });

  /* ...and a few keep changing their minds */
  if(!reduce && lights.length) setInterval(function(){
    for(var i=0;i<4;i++) lights[Math.floor(Math.random()*lights.length)].classList.toggle('on');
  }, 2200);

  /* ── dust in the light ─────────────────────────────── */
  var box = document.getElementById('motes'), r = rng(7), frag = document.createDocumentFragment();
  for(var i=0;i<22;i++){
    var m = document.createElement('div');
    m.className = 'mote';
    m.style.left = (30 + r()*62).toFixed(1)+'%';
    m.style.top  = (55 + r()*32).toFixed(1)+'%';
    m.style.animationDelay = '-'+(r()*16).toFixed(1)+'s';
    m.style.animationDuration = (12 + r()*10).toFixed(1)+'s';
    m.style.transform = 'scale('+(.6 + r()*1.1).toFixed(2)+')';
    frag.appendChild(m);
  }
  box.appendChild(frag);

  /* ── pet a cat ─────────────────────────────────────── */
  var CONFETTI = ['♥','♪','✨','♫','♥'];
  function burst(x, y, n){
    for(var i=0;i<n;i++) (function(i){
      setTimeout(function(){
        var h = document.createElement('div');
        h.className = 'heart';
        h.textContent = CONFETTI[i % CONFETTI.length];
        h.style.left = (x + (Math.random()*44-22)) + 'px';
        h.style.top  = y + 'px';
        h.style.setProperty('--dx', (Math.random()*70-35).toFixed(0)+'px');
        h.style.setProperty('--rot', (Math.random()*60-30).toFixed(0)+'deg');
        document.body.appendChild(h);
        setTimeout(function(){ h.remove(); }, 1200);
      }, i*70);
    })(i);
  }
  ['catA','catB'].forEach(function(id){
    var cat = document.getElementById(id);
    cat.addEventListener('click', function(){
      if(reduce) return;
      var b = cat.getBoundingClientRect();
      burst(b.left + b.width/2, b.top, 4);
      cat.style.transform = 'translateY(-7px)';
      setTimeout(function(){ cat.style.transform = ''; }, 420);
    });
  });

  var cta = document.getElementById('cta');
  cta.addEventListener('click', function(){
    if(reduce) return;
    var b = cta.getBoundingClientRect();
    burst(b.left + b.width/2, b.top, 6);
  });
})();
</script>
</body>
